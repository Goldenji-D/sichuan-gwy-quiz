name: Auto Update Quiz Every 2 Days

on:
  schedule:
    # 每2天运行一次（UTC 2点 = 北京时间上午10点）
    - cron: '0 2 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run auto update script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/auto_update.py

      - name: Check if questions updated
        id: check_update
        run: |
          if git diff --quiet index.html; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "没有新题目需要更新"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "检测到新题目，准备提交"
          fi

      - name: Commit and push changes
        if: steps.check_update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "auto: update quiz questions $(date +%Y-%m-%d)"
          git push

      - name: Configure GitHub Pages
        if: steps.check_update.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check_update.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.check_update.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
