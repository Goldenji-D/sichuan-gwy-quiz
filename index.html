    const storage = {
      get(key, def) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
        catch(e) { return def; }
      },
      set(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); }
        catch(e) {}
      }
    };

    const app = {
      mode: 'home',
      currentIndex: 0,
      practiceAnswers: {},
      examAnswers: {},
      examStartTime: 0,
      examTimerId: null,
      reviewList: [],
      reviewIndex: 0,

      init() {
        this.updateDate();
        this.updateStats();
      },

      updateDate() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const week = Math.ceil((((now - start) / 86400000) + start.getDay() + 1) / 7);
        document.getElementById('updateDate').textContent = `${now.getFullYear()}年第${week}周`;
      },

      updateStats() {
        const done = Object.keys(storage.get('practice_answers', {})).length;
        const wrong = this.getWrongList().length;
        document.getElementById('statDone').textContent = done;
        document.getElementById('statWrong').textContent = wrong;
      },

      getWrongList() { return storage.get('wrong_questions', []); },

      addWrong(qid) {
        const list = this.getWrongList();
        if (!list.includes(qid)) { list.push(qid); storage.set('wrong_questions', list); }
      },

      removeWrong(qid) {
        let list = this.getWrongList().filter(id => id !== qid);
        storage.set('wrong_questions', list);
        return list;
      },

      goHome() {
        this.hideAllScreens();
        document.getElementById('homeScreen').classList.remove('hidden');
        this.updateStats();
        this.mode = 'home';
      },

      hideAllScreens() {
        ['homeScreen', 'practiceScreen', 'examScreen', 'examResultScreen', 'wrongBookScreen', 'reviewScreen'].forEach(id => {
          document.getElementById(id).classList.add('hidden');
        });
      },

      // ========== 练习模式 ==========
      startPractice() {
        this.hideAllScreens();
        document.getElementById('practiceScreen').classList.remove('hidden');
        this.mode = 'practice';
        this.currentIndex = 0;
        this.practiceAnswers = storage.get('practice_answers', {});
        this.renderPractice();
      },

      renderPractice() {
        const q = QUESTIONS[this.currentIndex];
        const total = QUESTIONS.length;
        const answered = this.practiceAnswers[q.id];

        document.getElementById('practiceProgress').style.width = `${((this.currentIndex + 1) / total) * 100}%`;
        document.getElementById('practiceNum').textContent = this.currentIndex + 1;
        document.getElementById('practiceCategory').textContent = q.category;
        document.getElementById('practiceCategory').className = `px-2 py-1 rounded text-xs font-medium ${q.category === '四川时政' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}`;
        document.getElementById('practiceQuestion').textContent = q.question;

        const optsDiv = document.getElementById('practiceOptions');
        optsDiv.innerHTML = '';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn w-full text-left px-4 py-3 rounded-lg border text-sm font-medium transition';
          if (answered !== undefined) {
            if (i === q.answer) {
              btn.className += ' bg-emerald-50 border-emerald-400 text-emerald-800';
            } else if (i === answered && answered !== q.answer) {
              btn.className += ' bg-rose-50 border-rose-400 text-rose-800';
            } else {
              btn.className += ' bg-slate-50 border-slate-200 text-slate-500';
            }
            btn.disabled = true;
          } else {
            btn.className += ' bg-white border-slate-300 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50';
            btn.onclick = () => this.answerPractice(i);
          }
          btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
          optsDiv.appendChild(btn);
        });

        const analysisDiv = document.getElementById('practiceAnalysis');
        if (answered !== undefined) {
          analysisDiv.classList.remove('hidden');
          document.getElementById('practiceAnswerLabel').textContent = String.fromCharCode(65 + q.answer);
          document.getElementById('practiceAnalysisText').textContent = q.analysis;
          document.getElementById('practiceSource').textContent = q.source;
          document.getElementById('practiceSourceUrl').textContent = q.sourceUrl;
        } else {
          analysisDiv.classList.add('hidden');
        }

        document.getElementById('practicePrevBtn').disabled = this.currentIndex === 0;
        document.getElementById('practiceNextBtn').disabled = false;
        document.getElementById('practiceNextBtn').textContent = this.currentIndex === total - 1 ? '完成练习' : '下一题';
      },

      answerPractice(idx) {
        const q = QUESTIONS[this.currentIndex];
        this.practiceAnswers[q.id] = idx;
        storage.set('practice_answers', this.practiceAnswers);
        if (idx !== q.answer) {
          this.addWrong(q.id);
        }
        this.renderPractice();
        this.updateStats();
      },

      practicePrev() {
        if (this.currentIndex > 0) { this.currentIndex--; this.renderPractice(); }
      },

      practiceNext() {
        if (this.currentIndex < QUESTIONS.length - 1) { this.currentIndex++; this.renderPractice(); }
        else { this.goHome(); }
      },

      // ========== 模拟考试 ==========
      startExam() {
        this.hideAllScreens();
        document.getElementById('examScreen').classList.remove('hidden');
        this.mode = 'exam';
        this.currentIndex = 0;
        this.examAnswers = {};
        this.examStartTime = Date.now();
        this.renderExam();
        this.startExamTimer();
      },

      startExamTimer() {
        const totalSeconds = 30 * 60;
        let remaining = totalSeconds;
        const timerEl = document.getElementById('examTimer');
        if (this.examTimerId) clearInterval(this.examTimerId);
        this.examTimerId = setInterval(() => {
          remaining--;
          const m = Math.floor(remaining / 60).toString().padStart(2, '0');
          const s = (remaining % 60).toString().padStart(2, '0');
          timerEl.textContent = `${m}:${s}`;
          if (remaining <= 300) timerEl.classList.add('timer-warning');
          if (remaining <= 0) { clearInterval(this.examTimerId); this.submitExam(); }
        }, 1000);
      },

      renderExam() {
        const q = QUESTIONS[this.currentIndex];
        const total = QUESTIONS.length;
        const answered = this.examAnswers[q.id];

        document.getElementById('examProgress').style.width = `${((this.currentIndex + 1) / total) * 100}%`;
        document.getElementById('examNum').textContent = this.currentIndex + 1;
        document.getElementById('examCategory').textContent = q.category;
        document.getElementById('examCategory').className = `px-2 py-1 rounded text-xs font-medium ${q.category === '四川时政' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}`;
        document.getElementById('examQuestion').textContent = q.question;

        const optsDiv = document.getElementById('examOptions');
        optsDiv.innerHTML = '';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn w-full text-left px-4 py-3 rounded-lg border text-sm font-medium transition ' +
            (answered === i ? 'bg-emerald-50 border-emerald-400 text-emerald-800' : 'bg-white border-slate-300 text-slate-700 hover:border-emerald-400 hover:bg-emerald-50');
          btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
          btn.onclick = () => { this.examAnswers[q.id] = i; this.renderExam(); this.renderExamGrid(); };
          optsDiv.appendChild(btn);
        });

        document.getElementById('examPrevBtn').disabled = this.currentIndex === 0;
        document.getElementById('examNextBtn').textContent = this.currentIndex === total - 1 ? '最后一题' : '下一题';
        this.renderExamGrid();
      },

      renderExamGrid() {
        const grid = document.getElementById('examGrid');
        grid.innerHTML = '';
        QUESTIONS.forEach((q, i) => {
          const btn = document.createElement('button');
          const isCurrent = i === this.currentIndex;
          const isAnswered = this.examAnswers[q.id] !== undefined;
          btn.className = `h-9 rounded-lg text-sm font-medium transition ${
            isCurrent ? 'bg-emerald-600 text-white' :
            isAnswered ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' :
            'bg-slate-100 text-slate-500 border border-slate-200'
          }`;
          btn.textContent = i + 1;
          btn.onclick = () => { this.currentIndex = i; this.renderExam(); };
          grid.appendChild(btn);
        });
      },

      examPrev() { if (this.currentIndex > 0) { this.currentIndex--; this.renderExam(); } },
      examNext() { if (this.currentIndex < QUESTIONS.length - 1) { this.currentIndex++; this.renderExam(); } },

      quitExam() {
        if (confirm('确定要退出考试吗？当前进度将不会保存。')) {
          if (this.examTimerId) clearInterval(this.examTimerId);
          this.goHome();
        }
      },

      submitExam() {
        if (Object.keys(this.examAnswers).length < QUESTIONS.length) {
          if (!confirm(`还有 ${QUESTIONS.length - Object.keys(this.examAnswers).length} 道题未作答，确定提交吗？`)) return;
        }
        if (this.examTimerId) clearInterval(this.examTimerId);
        const timeUsed = Math.floor((Date.now() - this.examStartTime) / 60000);
        let correct = 0, wrong = 0;
        QUESTIONS.forEach(q => {
          const ans = this.examAnswers[q.id];
          if (ans === q.answer) { correct++; }
          else {
            wrong++;
            this.addWrong(q.id);
          }
        });
        const score = Math.round((correct / QUESTIONS.length) * 100);

        this.hideAllScreens();
        document.getElementById('examResultScreen').classList.remove('hidden');
        document.getElementById('examScore').textContent = score;
        document.getElementById('examCorrectCount').textContent = correct;
        document.getElementById('examWrongCount').textContent = wrong;
        document.getElementById('examTimeUsed').textContent = timeUsed;

        const msgEl = document.getElementById('examMsg');
        if (score >= 90) { msgEl.textContent = '🏆 太棒了！时政功底非常扎实！'; msgEl.className = 'mt-4 text-sm font-medium text-emerald-600'; this.fireConfetti(); }
        else if (score >= 80) { msgEl.textContent = '👍 成绩不错，继续保持！'; msgEl.className = 'mt-4 text-sm font-medium text-blue-600'; this.fireConfetti(); }
        else if (score >= 60) { msgEl.textContent = '💪 及格了，再多刷刷错题会有进步！'; msgEl.className = 'mt-4 text-sm font-medium text-amber-600'; }
        else { msgEl.textContent = '📚 还需要努力，建议先去顺序练习巩固基础！'; msgEl.className = 'mt-4 text-sm font-medium text-rose-600'; }

        const list = document.getElementById('examAnalysisList');
        list.innerHTML = '';
        QUESTIONS.forEach((q, i) => {
          const ans = this.examAnswers[q.id];
          const isCorrect = ans === q.answer;
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border p-4' + (isCorrect ? ' border-emerald-200' : ' border-rose-200');
          card.innerHTML = `
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold shrink-0 ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${i + 1}</div>
              <div class="flex-1">
                <p class="text-sm font-medium text-slate-800 mb-1">${q.question}</p>
                <p class="text-xs ${isCorrect ? 'text-emerald-600' : 'text-rose-600'} mb-2">
                  你的答案：${ans !== undefined ? String.fromCharCode(65 + ans) : '未作答'} | 正确答案：${String.fromCharCode(65 + q.answer)}
                </p>
                <div class="bg-slate-50 rounded-lg p-3 text-xs text-slate-700 leading-relaxed">
                  <span class="font-bold text-blue-700">解析：</span>${q.analysis}<br>
                  <span class="font-bold text-slate-500">来源：</span>${q.source}
                </div>
              </div>
            </div>
          `;
          list.appendChild(card);
        });

        this.updateStats();
      },

      fireConfetti() {
        for (let i = 0; i < 50; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.background = ['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa'][Math.floor(Math.random()*5)];
          c.style.animationDuration = (2 + Math.random() * 2) + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }
      },

      // ========== 错题集 ==========
      showWrongBook() {
        this.hideAllScreens();
        document.getElementById('wrongBookScreen').classList.remove('hidden');
        const wrongIds = this.getWrongList();
        const list = document.getElementById('wrongBookList');
        const empty = document.getElementById('wrongBookEmpty');
        list.innerHTML = '';
        if (wrongIds.length === 0) {
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');
        wrongIds.forEach(qid => {
          const q = QUESTIONS.find(x => x.id === qid);
          if (!q) return;
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border border-rose-200 p-4';
          card.innerHTML = `
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-0.5 rounded text-xs font-medium ${q.category === '四川时政' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}">${q.category}</span>
              <span class="text-xs text-slate-400">第${q.id}题</span>
            </div>
            <p class="text-sm font-medium text-slate-800 mb-2">${q.question}</p>
            <div class="space-y-1 mb-3">
              ${q.options.map((opt, i) => `<div class="text-sm px-3 py-1.5 rounded ${i === q.answer ? 'bg-emerald-50 text-emerald-800 font-medium' : 'text-slate-600'}">${String.fromCharCode(65 + i)}. ${opt}</div>`).join('')}
            </div>
            <div class="bg-slate-50 rounded-lg p-3 text-xs text-slate-700 leading-relaxed mb-3">
              <span class="font-bold text-blue-700">解析：</span>${q.analysis}
            </div>
            <div class="flex justify-between items-center">
              <span class="text-xs text-slate-400">来源：${q.source}</span>
              <button onclick="app.removeWrongAndRefresh(${q.id})" class="px-3 py-1.5 rounded-lg border border-rose-300 text-rose-600 text-xs hover:bg-rose-50">移除错题</button>
            </div>
          `;
          list.appendChild(card);
        });
      },

      removeWrongAndRefresh(qid) {
        this.removeWrong(qid);
        this.showWrongBook();
        this.updateStats();
      },

      // ========== 错题重练 ==========
      startReview() {
        const wrongIds = this.getWrongList();
        if (wrongIds.length === 0) {
          alert('暂无错题，先去练习吧！');
          return;
        }
        this.reviewList = wrongIds.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);
        this.reviewIndex = 0;
        this.hideAllScreens();
        document.getElementById('reviewScreen').classList.remove('hidden');
        document.getElementById('reviewTotal').textContent = this.reviewList.length;
        this.renderReview();
      },

      renderReview() {
        const q = this.reviewList[this.reviewIndex];
        const total = this.reviewList.length;

        document.getElementById('reviewProgress').style.width = `${((this.reviewIndex + 1) / total) * 100}%`;
        document.getElementById('reviewNum').textContent = this.reviewIndex + 1;
        document.getElementById('reviewCategory').textContent = q.category;
        document.getElementById('reviewCategory').className = `px-2 py-1 rounded text-xs font-medium ${q.category === '四川时政' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}`;
        document.getElementById('reviewQuestion').textContent = q.question;

        const optsDiv = document.getElementById('reviewOptions');
        optsDiv.innerHTML = '';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn w-full text-left px-4 py-3 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:border-amber-400 hover:bg-amber-50 transition';
          btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
          btn.onclick = () => this.answerReview(i);
          optsDiv.appendChild(btn);
        });

        document.getElementById('reviewAnalysis').classList.add('hidden');
        document.getElementById('reviewPrevBtn').disabled = this.reviewIndex === 0;
        document.getElementById('reviewNextBtn').disabled = true;
        document.getElementById('reviewNextBtn').textContent = this.reviewIndex === total - 1 ? '完成重练' : '下一题';
      },

      answerReview(idx) {
        const q = this.reviewList[this.reviewIndex];
        const isCorrect = idx === q.answer;

        const optsDiv = document.getElementById('reviewOptions');
        Array.from(optsDiv.children).forEach((btn, i) => {
          btn.disabled = true;
          btn.className = 'option-btn w-full text-left px-4 py-3 rounded-lg border text-sm font-medium transition ' +
            (i === q.answer ? 'bg-emerald-50 border-emerald-400 text-emerald-800' :
             i === idx && !isCorrect ? 'bg-rose-50 border-rose-400 text-rose-800' :
             'bg-slate-50 border-slate-200 text-slate-500');
        });

        document.getElementById('reviewAnalysis').classList.remove('hidden');
        document.getElementById('reviewAnswerLabel').textContent = String.fromCharCode(65 + q.answer);
        document.getElementById('reviewAnalysisText').textContent = q.analysis;
        document.getElementById('reviewSource').textContent = q.source;

        if (isCorrect) {
          this.removeWrong(q.id);
        }
        document.getElementById('reviewNextBtn').disabled = false;
        this.updateStats();
      },

      reviewPrev() { if (this.reviewIndex > 0) { this.reviewIndex--; this.renderReview(); } },
      reviewNext() {
        if (this.reviewIndex < this.reviewList.length - 1) { this.reviewIndex++; this.renderReview(); }
        else { alert('错题重练完成！答对的题目已从错题集中移除。'); this.goHome(); }
      }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
